<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xdaceo</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Material 3 color roles ---------- */
:root{
  --md-primary:#415f91;--md-on-primary:#fff;
  --md-primary-container:#d6e3ff;--md-on-primary-container:#001b3e;
  --md-secondary-container:#dbe2f9;--md-on-secondary-container:#141b2c;
  --md-surface:#f9f9ff;--md-on-surface:#191c20;--md-on-surface-variant:#44474e;
  --md-sc-low:#f3f3fa;--md-sc:#edeef4;--md-sc-high:#e7e8ee;
  --md-outline-variant:#c4c6d0;--md-scrim:rgba(0,0,0,.32);
  --md-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --md-easing:cubic-bezier(.2,0,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --md-primary:#aac7ff;--md-on-primary:#0a305f;
  --md-primary-container:#284777;--md-on-primary-container:#d6e3ff;
  --md-secondary-container:#3f4759;--md-on-secondary-container:#dbe2f9;
  --md-surface:#111318;--md-on-surface:#e2e2e9;--md-on-surface-variant:#c4c6d0;
  --md-sc-low:#191c20;--md-sc:#1d2024;--md-sc-high:#282a2f;
  --md-outline-variant:#44474e;--md-scrim:rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --md-primary:#aac7ff;--md-on-primary:#0a305f;
  --md-primary-container:#284777;--md-on-primary-container:#d6e3ff;
  --md-secondary-container:#3f4759;--md-on-secondary-container:#dbe2f9;
  --md-surface:#111318;--md-on-surface:#e2e2e9;--md-on-surface-variant:#c4c6d0;
  --md-sc-low:#191c20;--md-sc:#1d2024;--md-sc-high:#282a2f;
  --md-outline-variant:#44474e;--md-scrim:rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--md-surface);color:var(--md-on-surface);
  font-family:"Google Sans Flex","Google Sans","Product Sans",Figtree,system-ui,sans-serif;
  font-weight:700;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:24px;min-height:100dvh;
  transition:background-color .3s var(--md-easing),color .3s var(--md-easing);
}
main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px}

/* ---------- Profile header ---------- */
.profile{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
h1{font-size:36px;line-height:44px;font-weight:700;letter-spacing:0}
.subtitle{font-size:16px;line-height:24px;letter-spacing:.5px;color:var(--md-on-surface-variant);margin-top:4px}

/* ---------- List ---------- */
.list{list-style:none;padding:8px;background:var(--md-sc);border-radius:28px;display:flex;flex-direction:column;gap:2px}
.item{
  position:relative;display:flex;align-items:center;gap:16px;width:100%;
  min-height:72px;padding:12px 16px;border:0;border-radius:20px;
  background:transparent;color:var(--md-on-surface);text-decoration:none;
  font:inherit;text-align:left;cursor:pointer;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.list li:first-child .item{border-radius:20px 20px 8px 8px}
.list li:last-child .item{border-radius:8px 8px 20px 20px}
.item::before{ /* state layer */
  content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity .2s var(--md-easing);pointer-events:none;
}
.item:hover::before{opacity:.08}
.item:focus-visible{outline:3px solid var(--md-primary);outline-offset:-3px}
.item:focus-visible::before,.item:active::before{opacity:.12}
.lead{
  flex:none;width:48px;height:48px;border-radius:50%;
  background:var(--md-secondary-container);color:var(--md-on-secondary-container);
  display:grid;place-items:center;
}
.lead svg{width:24px;height:24px;fill:currentColor}
.text{flex:1;min-width:0;display:flex;flex-direction:column}
.headline{font-size:16px;line-height:24px;font-weight:700;letter-spacing:.15px}
.support{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--md-on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trail{flex:none;width:24px;height:24px;fill:var(--md-on-surface-variant)}

/* ---------- Icon button (theme) ---------- */
.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20}
.icon-btn{
  position:relative;width:48px;height:48px;border:0;border-radius:50%;overflow:hidden;
  background:var(--md-sc-high);color:var(--md-on-surface-variant);
  display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.icon-btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s var(--md-easing)}
.icon-btn:hover::before{opacity:.08}
.icon-btn:active::before{opacity:.12}
.icon-btn:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.icon-btn .moon{display:none}
:root[data-theme="light"] .icon-btn .sun{display:none}
:root[data-theme="light"] .icon-btn .moon{display:block}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .icon-btn .sun{display:none}:root:not([data-theme="dark"]) .icon-btn .moon{display:block}}

/* ---------- Dialog ---------- */
dialog{
  border:0;padding:24px 0 24px;margin:auto;width:calc(100% - 48px);max-width:400px;
  background:var(--md-sc-high);color:var(--md-on-surface);border-radius:28px;
  box-shadow:var(--md-shadow);
  max-height:calc(100dvh - 48px);overflow-y:auto;
}
dialog::backdrop{background:var(--md-scrim)}
dialog[open]{animation:dlg .3s var(--md-easing)}
dialog[open]::backdrop{animation:fade .3s var(--md-easing)}
@keyframes dlg{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg-icon{display:grid;place-items:center;margin-bottom:16px;color:var(--md-primary)}
.dlg-icon svg{width:24px;height:24px;fill:currentColor}
dialog h2{font-size:24px;line-height:32px;font-weight:700;text-align:center;padding:0 24px}
.dlg-list{list-style:none;padding:16px 8px 0;display:flex;flex-direction:column}
.dlg-row{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 16px}
.dlg-row .lead{width:40px;height:40px}
.dlg-row .lead svg{width:22px;height:22px}
.dlg-row+.dlg-row,.dlg-list li+li{border-top:0}
.actions{display:flex;justify-content:flex-end;padding:16px 24px 0}
.text-btn{
  position:relative;height:40px;padding:0 12px;border:0;border-radius:20px;overflow:hidden;
  background:transparent;color:var(--md-primary);font:inherit;font-size:14px;font-weight:700;letter-spacing:.1px;cursor:pointer;
}
.text-btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s var(--md-easing)}
.text-btn:hover::before{opacity:.08}
.text-btn:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px}
.text-btn:active::before{opacity:.12}

@media (prefers-reduced-motion:reduce){
  *,*::before,dialog[open],dialog[open]::backdrop{animation:none!important;transition:none!important}
}
</style></head><body>

<script>
(function(){
  const root=document.documentElement;
  let saved=null;
  try{saved=localStorage.getItem("theme")}catch(e){}
  if(saved==="light"||saved==="dark") root.setAttribute("data-theme",saved);

  document.getElementById("themeBtn").addEventListener("click",()=>{
    const cur=root.getAttribute("data-theme");
    const isLight=cur==="light"||(!cur&&matchMedia("(prefers-color-scheme:light)").matches);
    const next=isLight?"dark":"light";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next)}catch(e){}
  });

  const dlg=document.getElementById("devicesDialog");
  document.getElementById("devicesBtn").addEventListener("click",()=>dlg.showModal());
  document.getElementById("closeDevices").addEventListener("click",()=>dlg.close());
  dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
})();
</script>
